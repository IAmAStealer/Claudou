# Checks on every push and pull request; a commit with a line "release: vX.Y.Z" becomes that release.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Owner's rule: no code from a package registry. These checks run before anything else.
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0          # gitleaks scans the whole history
      - name: No npm dependencies, no lockfile, no package imports
        run: python3 tools/no_dependencies.py
      - name: Gitleaks (secrets in the history)
        run: |
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum -c
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          ./gitleaks git . --no-banner --redact
      - name: Python tools
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v

  # The mod itself: Claude Code validates it and runs its tests; TypeScript checks the types.
  # Both owner-approved (2026-10-03): Claude Code from Anthropic's official installer, pinned to the version
  # vendor/claude-code.d.ts comes from; TypeScript 6.0.3 as one file checked against the npm registry's sha512.
  plugin:
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_VERSION: "2.1.288"
      DISABLE_AUTOUPDATER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: The vendored API is the pinned Claude Code's
        run: grep -qx "// Written by Claude Code $CLAUDE_CODE_VERSION." <(head -1 vendor/claude-code.d.ts)
      - name: Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh -o install.sh
          bash install.sh "$CLAUDE_CODE_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: TypeScript 6.0.3 (no npm)
        run: |
          curl -fsSLo typescript.tgz https://registry.npmjs.org/typescript/-/typescript-6.0.3.tgz
          want=$(curl -fsS https://registry.npmjs.org/typescript/6.0.3 | python3 -c "import json,sys; print(json.load(sys.stdin)['dist']['integrity'])")
          got="sha512-$(openssl dgst -sha512 -binary typescript.tgz | base64 -w0)"
          [ "$want" = "$got" ] || { echo "::error::typescript-6.0.3.tgz checksum mismatch"; exit 1; }
          mkdir -p "$RUNNER_TEMP/ts" && tar -xzf typescript.tgz -C "$RUNNER_TEMP/ts"
      - name: Validate the mod
        run: claude plugin validate plugin
      - name: Only the reviewed hooks and calls (tools/capabilities.json)
        run: python3 tools/capabilities.py
      - name: Types
        run: node "$RUNNER_TEMP/ts/package/bin/tsc" -p .
      - name: Tests
        run: claude plugin test plugin

  # A commit on main with a line "release: v1.2.3" becomes that release once every check passed.
  release:
    needs: [rules, plugin]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Tag and publish a release commit
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          version=$(printf '%s\n' "$MESSAGE" | grep -oE '^release: v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 | cut -d' ' -f2)
          if [ -z "$version" ]; then echo "Not a release commit."; exit 0; fi
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then echo "$version already exists."; exit 0; fi
          python3 tools/changelog.py "$version" > notes.md || { echo "::error title=No changelog::Add '## $version' to CHANGELOG.md"; exit 1; }
          grep -q "\"version\": \"${version#v}\"" plugin/.claude-plugin/plugin.json || { echo "::error title=Version::plugin.json says another version"; exit 1; }
          git tag "$version"
          git push origin "$version"
          gh release create "$version" --title "Claudou $version" --notes-file notes.md
